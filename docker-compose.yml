# Configuração comum dos workers do RabbitMQ: mesma imagem do Laravel, só muda o command de cada serviço
x-worker: &worker
  build:
    context: .
    dockerfile: Dockerfile
  image: mensageria-laravel      # nome único: os workers reaproveitam a mesma imagem
  restart: unless-stopped        # se o worker cair, o Docker o sobe de novo
  volumes:
    - ./laravel:/var/www/html
  networks:
    - rede_mensageria
  depends_on:
    apache_php83:
      condition: service_healthy # só inicia depois que o Laravel terminou composer install, migrate e rabbitmq:setup
                                 # (tabelas e filas já existem). O Laravel, por sua vez, só sobe com MySQL e RabbitMQ saudáveis

services:

  apache_php83:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: LARAVEL_MENSAGERIA
    ports:
      - "80:80"
    volumes:
      - ./laravel:/var/www/html
    environment:
      COMPOSER_ALLOW_SUPERUSER: 1  # o composer roda como root no container: sem este aviso de segurança
    # Prepara o ambiente ANTES de iniciar o Apache. O "&&" interrompe a sequência se algum comando falhar
    # (o container então encerra, em vez de subir um Apache com o ambiente quebrado).
    # O "exec" faz o Apache assumir o processo principal do container (recebe os sinais do Docker).
    command: >
      sh -c " rm -fr /var/www/html/vendor &&
      composer install --no-interaction &&
      php artisan migrate --force &&
      php artisan db:seed &&
      php artisan rabbitmq:setup &&
      exec apache2-foreground"
    # Só inicia com o MySQL e o RabbitMQ prontos: composer/migrate/setup dependem dos dois
    depends_on:
      mysql:
        condition: service_healthy
      rmq_mensageria_exercicio:
        condition: service_healthy
    # "Saudável" = Apache respondendo, o que só acontece depois dos três comandos. Os workers esperam por isso
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/public/up"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 600s           # tempo máximo de preparo (composer install + migrate + rabbitmq:setup)
    networks:
      - rede_mensageria

  rmq_mensageria_exercicio:
    image: rabbitmq:3-management
    container_name: RABBITMQ_EXERCICIO
    hostname: rabbitmq_exercicio
    ports:
      - "5672:5672"    # AMQP protocol
      - "15672:15672"  # Management UI
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - ./rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rede_mensageria

  mysql:
    image: mysql:8.4
    container_name: MYSQL_MENSAGERIA
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: mensageria
      MYSQL_USER: rodrigo
      MYSQL_PASSWORD: 123456
    ports:
      - "3306:3306"
    volumes:
      - ./mysql_data:/var/lib/mysql
    # Necessário para o Laravel esperar o MySQL aceitar conexões (depends_on com service_healthy).
    # Usa 127.0.0.1 (TCP): durante a 1ª inicialização o servidor temporário só escuta no socket local
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - rede_mensageria

  phpmyadmin:
    image: phpmyadmin:5
    container_name: PHPMYADMIN_MENSAGERIA
    restart: unless-stopped
    depends_on:
      - mysql
    environment:
      PMA_HOST: mysql      # nome do serviço do MySQL, resolvido pela rede rede_mensageria
      PMA_PORT: 3306
      UPLOAD_LIMIT: 64M
    ports:
      - "8080:80"          # http://localhost:8080
    networks:
      - rede_mensageria

  # Workers: cada um consome a sua fila. Para escalar: docker compose up -d --scale worker_email=3
  # Depois de alterar o código de um worker: docker compose restart worker_estoque (o código fica em memória)
  worker_estoque:
    <<: *worker
    container_name: WORKER_ESTOQUE
    command: php artisan rabbitmq:worker-estoque

  worker_email:
    <<: *worker
    container_name: WORKER_EMAIL
    command: php artisan rabbitmq:worker-email

  worker_nota:
    <<: *worker
    container_name: WORKER_NOTA
    command: php artisan rabbitmq:worker-nota

networks:
  rede_mensageria:
    driver: bridge
# Configuração comum dos workers do RabbitMQ: mesma imagem do Laravel, só muda o command de cada serviço
x-worker: &worker
  build:
    context: .
    dockerfile: Dockerfile
  image: mensageria-laravel      # nome único: os workers reaproveitam a mesma imagem
  restart: unless-stopped        # se o worker cair, o Docker o sobe de novo
  volumes:
    - ./laravel:/var/www/html
  networks:
    - rede_mensageria
  depends_on:
    rmq_mensageria_exercicio:
      condition: service_healthy # só inicia quando o RabbitMQ responde (healthcheck)

services:

  apache_php83:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: LARAVEL_MENSAGERIA
    ports:
      - "80:80"
    volumes:
      - ./laravel:/var/www/html
    networks:
      - rede_mensageria
    
  rmq_mensageria_exercicio:
    image: rabbitmq:3-management
    container_name: RABBITMQ_EXERCICIO
    hostname: rabbitmq_exercicio
    ports:
      - "5672:5672"    # AMQP protocol
      - "15672:15672"  # Management UI
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - ./rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rede_mensageria

  mysql:
    image: mysql:8.4
    container_name: MYSQL_MENSAGERIA
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: mensageria
      MYSQL_USER: rodrigo
      MYSQL_PASSWORD: 123456
    ports:
      - "3306:3306"
    volumes:
      - ./mysql_data:/var/lib/mysql
    networks:
      - rede_mensageria

  phpmyadmin:
    image: phpmyadmin:5
    container_name: PHPMYADMIN_MENSAGERIA
    restart: unless-stopped
    depends_on:
      - mysql
    environment:
      PMA_HOST: mysql      # nome do serviço do MySQL, resolvido pela rede rede_mensageria
      PMA_PORT: 3306
      UPLOAD_LIMIT: 64M
    ports:
      - "8080:80"          # http://localhost:8080
    networks:
      - rede_mensageria

  # Workers: cada um consome a sua fila. Para escalar: docker compose up -d --scale worker_email=3
  # Depois de alterar o código de um worker: docker compose restart worker_estoque (o código fica em memória)
  worker_estoque:
    <<: *worker
    container_name: WORKER_ESTOQUE
    command: php artisan rabbitmq:worker-estoque

  worker_email:
    <<: *worker
    container_name: WORKER_EMAIL
    command: php artisan rabbitmq:worker-email

  worker_nota:
    <<: *worker
    container_name: WORKER_NOTA
    command: php artisan rabbitmq:worker-nota

networks:
  rede_mensageria:
    driver: bridge